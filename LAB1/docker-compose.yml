services:
  db:
    image: redis:alpine
    container_name: db
    networks:
      - backend
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 3

  app:
    build: .
    networks:
      frontend:
        aliases:
          - app
      backend:
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 2

  proxy:
    image: nginx:alpine
    container_name: proxy
    ports:
      - "8080:80"
    volumes:
      - ./default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - frontend
    depends_on:
      - app

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge